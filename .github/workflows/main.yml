name: Build ABI Bypass APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Sign APK
        run: |
          set -e
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM_JAR=$(ls $ANDROID_HOME/platforms/android-*/android.jar | sort -V | tail -n 1)
          export PATH="$PATH:$BUILD_TOOLS"

          mkdir -p src/com/example/abibypass stubs/de/robv/android/xposed/callbacks assets res/values build/stubs build/app

          # 1. Create compile-time Xposed API stubs
          cat << 'EOF' > stubs/de/robv/android/xposed/IXposedHookLoadPackage.java
          package de.robv.android.xposed;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;
          public interface IXposedHookLoadPackage {
              void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable;
          }
          EOF

          cat << 'EOF' > stubs/de/robv/android/xposed/callbacks/XC_LoadPackage.java
          package de.robv.android.xposed.callbacks;
          public abstract class XC_LoadPackage {
              public static final class LoadPackageParam {
                  public String packageName;
                  public ClassLoader classLoader;
              }
          }
          EOF

          cat << 'EOF' > stubs/de/robv/android/xposed/XC_MethodHook.java
          package de.robv.android.xposed;
          public abstract class XC_MethodHook {
              public static final class MethodHookParam {
                  public Object[] args;
              }
              protected void beforeHookedMethod(MethodHookParam param) throws Throwable {}
              protected void afterHookedMethod(MethodHookParam param) throws Throwable {}
          }
          EOF

          cat << 'EOF' > stubs/de/robv/android/xposed/XposedHelpers.java
          package de.robv.android.xposed;
          public final class XposedHelpers {
              public static Object findAndHookMethod(String className, ClassLoader classLoader, String methodName, Object... parameterTypesAndCallback) {
                  return null;
              }
          }
          EOF

          # 2. Create AndroidManifest.xml, scope array, and xposed_init
          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com"
              package="com.example.abibypass"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34" />
              <application android:label="ABI Bypass" android:hasCode="true">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="Bypass pm 32-bit ABI check" />
                  <meta-data android:name="xposedminversion" android:value="93" />
                  <meta-data android:name="xposedscope" android:resource="@array/xposed_scope" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > res/values/arrays.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="xposed_scope">
                  <item>android</item>
              </string-array>
          </resources>
          EOF

          echo "com.example.abibypass.Hook" > assets/xposed_init

          # 3. Write Hook.java (appends armeabi-v7a and armeabi to param.args[1])
          cat << 'EOF' > src/com/example/abibypass/Hook.java
          package com.example.abibypass;

          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;
          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class Hook implements IXposedHookLoadPackage {
              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) {
                  if (!"android".equals(lpparam.packageName)) return;

                  XposedHelpers.findAndHookMethod(
                      "com.android.internal.content.NativeLibraryHelper",
                      lpparam.classLoader,
                      "findSupportedAbi",
                      "com.android.internal.content.NativeLibraryHelper$Handle",
                      String[].class,
                      new XC_MethodHook() {
                          @Override
                          protected void beforeHookedMethod(MethodHookParam param) {
                              String[] abis = (String[]) param.args[1];
                              if (abis == null) return;
                              List<String> list = new ArrayList<>(Arrays.asList(abis));
                              if (!list.contains("armeabi-v7a")) list.add("armeabi-v7a");
                              if (!list.contains("armeabi")) list.add("armeabi");
                              param.args[1] = list.toArray(new String[0]);
                          }
                      }
                  );
              }
          }
          EOF

          # 4. Compile Java -> classes.dex
          javac --release 11 -d build/stubs $(find stubs -name "*.java")
          javac --release 11 -cp "$PLATFORM_JAR:build/stubs" -d build/app src/com/example/abibypass/Hook.java
          d8 --lib "$PLATFORM_JAR" --output build build/app/com/example/abibypass/*.class

          # 5. Package resources, store classes.dex uncompressed (-0), zipalign, and sign
          aapt2 compile --dir res -o build/res.zip
          aapt2 link -I "$PLATFORM_JAR" --manifest AndroidManifest.xml -A assets build/res.zip -o build/unsigned.apk
          cd build && zip -0 -uj unsigned.apk classes.dex && cd ..
          zipalign -p -f 4 build/unsigned.apk build/aligned.apk

          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android --out abibypass.apk build/aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abibypass-apk
          path: abibypass.apk
